[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portal_client"
version = "1.5.0"
description = "Download client tool for IGS Portal servers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "boto3>=1.40",
    "google-cloud-storage>=3.4",
    "packaging>=23.0",
    "requests>=2.32"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "flake8>=6.0"
]

[tool.setuptools]
packages = ["lib"]
# include the example data in the source distribution
include-package-data = true

[tool.setuptools.package-data]
lib = ["example_manifests/*"]

[project.scripts]
portal-client = "lib.portal_client:main"

